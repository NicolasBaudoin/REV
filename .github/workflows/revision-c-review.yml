name: Revision review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'entrainement/**'
      - 'rank04/**'
      - 'rank05/**'
      - 'rank06/**'
      - 'test.sh'
      - 'tools/**'
      - '.github/scripts/review_revision_c.sh'
      - '.github/workflows/revision-c-review.yml'

permissions:
  contents: read

jobs:
  review:
    name: Compare entrainement/ with the reference solutions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install valgrind and netcat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind netcat-openbsd >/dev/null

      - name: Run checks
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: set -o pipefail; bash .github/scripts/review_revision_c.sh "$PUSH_BEFORE" "$PUSH_AFTER" | tee "$GITHUB_STEP_SUMMARY"
